name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - claude/military-duty-scheduler-PFure

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          npx firebase-tools@latest deploy --only hosting --project rome-123
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
