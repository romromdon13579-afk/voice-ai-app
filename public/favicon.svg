<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <defs>
    <linearGradient id="shieldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0dce8"/>
      <stop offset="20%" stop-color="#a0b4c8"/>
      <stop offset="45%" stop-color="#c8d6e4"/>
      <stop offset="70%" stop-color="#7a90a8"/>
      <stop offset="100%" stop-color="#aabcce"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#142040"/>
      <stop offset="100%" stop-color="#091628"/>
    </linearGradient>
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e4a8a"/>
      <stop offset="100%" stop-color="#163670"/>
    </linearGradient>
    <linearGradient id="orangeCell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8842a"/>
      <stop offset="100%" stop-color="#c96018"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield outer (metallic) -->
  <path d="M100,8 L186,42 L186,118 Q186,174 100,202 Q14,174 14,118 L14,42 Z"
        fill="url(#shieldOuter)" stroke="#8899b0" stroke-width="1"/>

  <!-- Shield inner (dark navy) -->
  <path d="M100,18 L176,50 L176,118 Q176,168 100,193 Q24,168 24,118 L24,50 Z"
        fill="url(#shieldInner)"/>

  <!-- Subtle blueprint grid lines -->
  <g stroke="#1e3558" stroke-width="0.5" opacity="0.6">
    <line x1="24" y1="70" x2="176" y2="70"/>
    <line x1="24" y1="90" x2="176" y2="90"/>
    <line x1="24" y1="110" x2="176" y2="110"/>
    <line x1="24" y1="130" x2="176" y2="130"/>
    <line x1="24" y1="150" x2="176" y2="150"/>
    <line x1="50" y1="50" x2="50" y2="185"/>
    <line x1="75" y1="50" x2="75" y2="190"/>
    <line x1="100" y1="50" x2="100" y2="193"/>
    <line x1="125" y1="50" x2="125" y2="190"/>
    <line x1="150" y1="50" x2="150" y2="185"/>
  </g>

  <!-- Calendar shadow/glow -->
  <rect x="52" y="66" width="96" height="88" rx="5" fill="#0a1828" opacity="0.5"/>

  <!-- Calendar body -->
  <rect x="50" y="64" width="96" height="88" rx="5" fill="#163060" stroke="#2a5090" stroke-width="1"/>

  <!-- Calendar header bar -->
  <rect x="50" y="64" width="96" height="16" rx="5" fill="url(#calHeader)"/>
  <rect x="50" y="72" width="96" height="8" fill="url(#calHeader)"/>

  <!-- Calendar hooks/rings -->
  <rect x="67" y="58" width="7" height="14" rx="3" fill="#4a78c0" stroke="#6090d8" stroke-width="0.5"/>
  <rect x="122" y="58" width="7" height="14" rx="3" fill="#4a78c0" stroke="#6090d8" stroke-width="0.5"/>

  <!-- Clock on top of calendar -->
  <circle cx="100" cy="60" r="14" fill="#163060" stroke="#4a78c0" stroke-width="1.5"/>
  <circle cx="100" cy="60" r="11" fill="#1a3878" stroke="#3060a8" stroke-width="0.5"/>
  <!-- Clock tick marks -->
  <line x1="100" y1="50" x2="100" y2="52" stroke="#8ab0e0" stroke-width="1"/>
  <line x1="100" y1="68" x2="100" y2="70" stroke="#8ab0e0" stroke-width="1"/>
  <line x1="90" y1="60" x2="92" y2="60" stroke="#8ab0e0" stroke-width="1"/>
  <line x1="108" y1="60" x2="110" y2="60" stroke="#8ab0e0" stroke-width="1"/>
  <!-- Clock hands -->
  <line x1="100" y1="60" x2="100" y2="52" stroke="#c8dcf0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="100" y1="60" x2="106" y2="62" stroke="#c8dcf0" stroke-width="1" stroke-linecap="round"/>
  <circle cx="100" cy="60" r="1.5" fill="#c8dcf0"/>

  <!-- Calendar grid - Row 1 (days header dots) -->
  <g fill="#3060a8" opacity="0.8">
    <rect x="55" y="83" width="12" height="10" rx="1"/>
    <rect x="70" y="83" width="12" height="10" rx="1"/>
    <rect x="85" y="83" width="12" height="10" rx="1"/>
    <rect x="100" y="83" width="12" height="10" rx="1"/>
    <rect x="115" y="83" width="12" height="10" rx="1"/>
    <rect x="130" y="83" width="12" height="10" rx="1"/>
  </g>

  <!-- Calendar grid - Row 2 -->
  <g fill="#204880">
    <rect x="55" y="96" width="12" height="10" rx="1"/>
    <rect x="70" y="96" width="12" height="10" rx="1"/>
    <rect x="85" y="96" width="12" height="10" rx="1"/>
    <rect x="100" y="96" width="12" height="10" rx="1"/>
    <rect x="115" y="96" width="12" height="10" rx="1"/>
    <rect x="130" y="96" width="12" height="10" rx="1"/>
  </g>

  <!-- Calendar grid - Row 3 (with orange cells) -->
  <rect x="55" y="109" width="12" height="10" rx="1" fill="#204880"/>
  <rect x="70" y="109" width="12" height="10" rx="1" fill="#204880"/>
  <rect x="85" y="109" width="12" height="10" rx="1" fill="#204880"/>
  <rect x="100" y="109" width="12" height="10" rx="1" fill="#204880"/>
  <rect x="115" y="109" width="12" height="10" rx="1" fill="url(#orangeCell)"/>
  <rect x="130" y="109" width="12" height="10" rx="1" fill="url(#orangeCell)" opacity="0.85"/>

  <!-- Calendar grid - Row 4 -->
  <g fill="#204880">
    <rect x="55" y="122" width="12" height="10" rx="1"/>
    <rect x="70" y="122" width="12" height="10" rx="1"/>
    <rect x="85" y="122" width="12" height="10" rx="1"/>
    <rect x="100" y="122" width="12" height="10" rx="1"/>
    <rect x="115" y="122" width="12" height="10" rx="1"/>
    <rect x="130" y="122" width="12" height="10" rx="1"/>
  </g>

  <!-- Shield highlight (top-left sheen) -->
  <path d="M100,18 L140,34 L140,60 Q120,55 100,55 Q80,55 60,60 L60,34 Z"
        fill="white" opacity="0.04"/>

  <!-- Text below shield -->
  <text x="100" y="224" text-anchor="middle"
        font-family="Arial, 'Arial Hebrew', sans-serif"
        font-weight="900" font-size="19" fill="white"
        letter-spacing="0.5">ניהול שבצ"ק חכם</text>
</svg>
